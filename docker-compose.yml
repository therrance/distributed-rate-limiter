services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RATE_LIMIT: ${RATE_LIMIT:-10}
      TIME_WINDOW: ${TIME_WINDOW:-60}
      USER_RATE_LIMIT: ${USER_RATE_LIMIT:-10}
      USER_TIME_WINDOW: ${USER_TIME_WINDOW:-60}
      PORT: 3000
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data: