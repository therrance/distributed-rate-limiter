apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rate-limiter.fullname" . }}-edge
  labels:
    {{- include "rate-limiter.labels" . | nindent 4 }}
    app.kubernetes.io/component: edge
spec:
  replicas: {{ .Values.edge.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rate-limiter.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: edge
  template:
    metadata:
      labels:
        {{- include "rate-limiter.labels" . | nindent 8 }}
        app.kubernetes.io/component: edge
      annotations:
        # ConfigMap changes do not restart pods by themselves; this rolls the
        # edge whenever the config or Lua changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap-edge.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "rate-limiter.serviceAccountName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: {{ include "rate-limiter.name" . }}
                    app.kubernetes.io/instance: {{ .Release.Name }}
                    app.kubernetes.io/component: edge
      # Long enough for the preStop drain below to finish.
      terminationGracePeriodSeconds: 40
      containers:
        - name: edge
          image: "{{ .Values.edge.image.repository }}:{{ .Values.edge.image.tag }}"
          imagePullPolicy: {{ .Values.edge.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: REDIS_HOST
              value: {{ include "rate-limiter.redisHost" . | quote }}
            - name: REDIS_PORT
              value: {{ include "rate-limiter.redisPort" . | quote }}
            - name: RATE_LIMIT
              value: {{ .Values.rateLimit.limit | quote }}
            - name: TIME_WINDOW
              value: {{ .Values.rateLimit.window | quote }}
            - name: USER_RATE_LIMIT
              value: {{ .Values.rateLimit.userLimit | quote }}
            - name: USER_TIME_WINDOW
              value: {{ .Values.rateLimit.userWindow | quote }}
            - name: RATE_LIMIT_FAIL_OPEN
              value: {{ .Values.rateLimit.failOpen | quote }}
            - name: REDIS_TIMEOUT_MS
              value: {{ .Values.edge.redis.timeoutMs | quote }}
            - name: REDIS_KEEPALIVE_IDLE_MS
              value: {{ .Values.edge.redis.keepaliveIdleMs | quote }}
            - name: REDIS_KEEPALIVE_POOL_SIZE
              value: {{ .Values.edge.redis.keepalivePoolSize | quote }}
          lifecycle:
            preStop:
              # Two separate problems, both needed for a zero-downtime roll:
              #  1. Pod deletion and Endpoints removal race, so kube-proxy can
              #     still send new connections here after termination starts.
              #     Sleep first and keep serving until that propagates.
              #  2. Kubernetes then sends SIGTERM, which nginx treats as a
              #     fast shutdown that drops in-flight requests; `-s quit`
              #     drains them instead.
              exec:
                command:
                  - /bin/sh
                  - -c
                  - "sleep {{ .Values.edge.drainDelaySeconds }}; /usr/local/openresty/bin/openresty -s quit"
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.edge.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
            - name: lua
              mountPath: /etc/nginx/lua
            - name: redis-script
              mountPath: /etc/nginx/redis
      volumes:
        - name: config
          configMap:
            name: {{ include "rate-limiter.fullname" . }}-edge
            items:
              - key: main.main
                path: main.main
              - key: tuning.main
                path: tuning.main
              - key: default.conf
                path: default.conf
              - key: upstream.inc
                path: upstream.inc
              {{- if .Values.edge.realIp.enabled }}
              - key: realip.conf
                path: realip.conf
              {{- end }}
        - name: lua
          configMap:
            name: {{ include "rate-limiter.fullname" . }}-edge
            items:
              - key: rate_limit.lua
                path: rate_limit.lua
        - name: redis-script
          configMap:
            name: {{ include "rate-limiter.fullname" . }}-edge
            items:
              - key: rate_limiter.lua
                path: rate_limiter.lua
