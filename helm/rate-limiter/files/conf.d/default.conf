lua_package_path "/etc/nginx/lua/?.lua;;";

# lua-resty-redis resolves hostnames through nginx's resolver rather than libc,
# so one is required. local=on reads /etc/resolv.conf, which works unchanged
# under Docker (127.0.0.11) and Kubernetes (CoreDNS).
resolver local=on ipv6=off valid=10s;
resolver_timeout 2s;

init_by_lua_block {
    require("rate_limit").init()
}

# Defines upstream app_backend. Environment-specific: the backend's address
# differs between compose and Kubernetes, so it is the one piece kept out of
# this shared file. Named .inc so the stock *.conf glob does not include it
# twice.
include /etc/nginx/conf.d/upstream.inc;

server {
    listen      8080;
    server_name _;

    # Outside location /, so it never runs access_by_lua or spends budget.
    location = /nginx-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location / {
        access_by_lua_block {
            require("rate_limit").run()
        }

        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # For the app's logs only; it no longer rate limits.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        proxy_read_timeout    30s;
    }
}
