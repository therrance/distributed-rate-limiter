lua_package_path "/etc/nginx/lua/?.lua;;";

# Docker's embedded DNS. lua-resty-redis resolves "redis" through nginx's own
# resolver, which ignores /etc/hosts and /etc/resolv.conf.
resolver 127.0.0.11 ipv6=off valid=10s;
resolver_timeout 2s;

init_by_lua_block {
    require("rate_limit").init()
}

upstream app_backend {
    # Resolved once at start-up via libc, not the `resolver` above; nginx
    # exits if "app" doesn't resolve yet, hence depends_on: app in compose.
    server app:3000;
    keepalive 32;
}

server {
    listen      8080;
    server_name _;

    # Outside location /, so it never runs access_by_lua or spends budget.
    location = /nginx-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location / {
        access_by_lua_block {
            require("rate_limit").run()
        }

        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # For the app's logs only; it no longer rate limits.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        proxy_read_timeout    30s;
    }
}
